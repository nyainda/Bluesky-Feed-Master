openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bluesky Feed Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feeds
    description: Feed management
  - name: posts
    description: Indexed posts
  - name: stats
    description: Statistics and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feeds:
    get:
      operationId: listFeeds
      tags: [feeds]
      summary: List all feeds
      responses:
        "200":
          description: List of feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
    post:
      operationId: createFeed
      tags: [feeds]
      summary: Create a new feed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedBody"
      responses:
        "201":
          description: Created feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Bad request

  /feeds/{id}:
    get:
      operationId: getFeed
      tags: [feeds]
      summary: Get a single feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "404":
          description: Not found
    patch:
      operationId: updateFeed
      tags: [feeds]
      summary: Update a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedBody"
      responses:
        "200":
          description: Updated feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "404":
          description: Not found
    delete:
      operationId: deleteFeed
      tags: [feeds]
      summary: Delete a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /feeds/{id}/publish:
    post:
      operationId: publishFeed
      tags: [feeds]
      summary: Publish a feed to Bluesky
      description: Creates or updates the app.bsky.feed.generator record in the publisher's Bluesky repo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishFeedResult"
        "400":
          description: Missing configuration (env vars not set)
        "404":
          description: Feed not found
        "500":
          description: Bluesky API error

  /feeds/{id}/keywords:
    get:
      operationId: getFeedKeywords
      tags: [feeds]
      summary: Get keywords for a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      operationId: addFeedKeyword
      tags: [feeds]
      summary: Add a keyword to a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeywordBody"
      responses:
        "201":
          description: Created keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"

  /feeds/{id}/keywords/{keywordId}:
    delete:
      operationId: deleteFeedKeyword
      tags: [feeds]
      summary: Remove a keyword from a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: keywordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /feeds/{id}/posts:
    get:
      operationId: getFeedPosts
      tags: [posts]
      summary: Get indexed posts for a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List all indexed posts (across all feeds)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Posts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get dashboard overview statistics
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/firehose:
    get:
      operationId: getFirehoseStatus
      tags: [stats]
      summary: Get firehose connection status
      responses:
        "200":
          description: Firehose status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirehoseStatus"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent post indexing activity (last 24h hourly buckets)
      responses:
        "200":
          description: Activity data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityBucket"

  /stats/top-feeds:
    get:
      operationId: getTopFeeds
      tags: [stats]
      summary: Get feeds ranked by post count
      responses:
        "200":
          description: Feed rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedRanking"

  /stats/7day:
    get:
      operationId: get7DayActivity
      tags: [stats]
      summary: Get 7-day daily post indexing activity
      responses:
        "200":
          description: Daily activity buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyBucket"

  /feeds/{id}/keyword-stats:
    get:
      operationId: getFeedKeywordStats
      tags: [feeds]
      summary: Get keyword performance stats for a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Keyword stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordStat"
        "404":
          description: Feed not found

  /feeds/{id}/top-authors:
    get:
      operationId: getFeedTopAuthors
      tags: [feeds]
      summary: Get top contributing authors for a feed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Top authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorStat"
        "404":
          description: Feed not found

  /feeds/{id}/hourly:
    get:
      operationId: getFeedHourly
      tags: [feeds]
      summary: Get hourly post activity for a feed (last 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hourly buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityBucket"

  /bluesky/profile:
    get:
      operationId: getBlueskyProfile
      tags: [stats]
      summary: Get the publisher's Bluesky profile info
      responses:
        "200":
          description: Profile info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueskyProfile"
        "404":
          description: Publisher DID not configured

  /bluesky/feed-info/{recordName}:
    get:
      operationId: getBlueskyFeedInfo
      tags: [stats]
      summary: Get feed generator info from Bluesky (like count, viewers)
      parameters:
        - name: recordName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feed info from Bluesky
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueskyFeedInfo"
        "404":
          description: Not found or not published

  /stats/top-posts:
    get:
      operationId: getTopPosts
      tags: [stats]
      summary: Get top indexed posts by engagement (likes + reposts + replies + quotes)
      parameters:
        - name: feedId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [total, likes, reposts, replies]
            default: total
      responses:
        "200":
          description: Top posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopPost"

  /stats/engagement-overview:
    get:
      operationId: getEngagementOverview
      tags: [stats]
      summary: Get aggregate engagement stats for all indexed posts, optionally filtered by feed
      parameters:
        - name: feedId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Aggregate engagement stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementOverview"

  /bluesky/sync-engagement:
    post:
      operationId: syncEngagement
      tags: [stats]
      summary: Sync real engagement data (likes, reposts, replies, quotes) from Bluesky for recent indexed posts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedId:
                  type: ["integer", "null"]
                limit:
                  type: integer
                  default: 100
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /bluesky/followers:
    get:
      operationId: getFollowers
      tags: [stats]
      summary: Get your Bluesky followers
      parameters:
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Followers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudiencePage"

  /bluesky/following:
    get:
      operationId: getFollowing
      tags: [stats]
      summary: Get accounts you follow on Bluesky
      parameters:
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Following page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudiencePage"

  /bluesky/not-following-back:
    get:
      operationId: getNotFollowingBack
      tags: [stats]
      summary: Get people you follow who do not follow you back
      responses:
        "200":
          description: List of users not following back
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudienceUser"

  /bluesky/bulk-follow:
    post:
      operationId: bulkFollow
      tags: [stats]
      summary: Follow multiple Bluesky accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionBody"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /bluesky/bulk-unfollow:
    post:
      operationId: bulkUnfollow
      tags: [stats]
      summary: Unfollow multiple Bluesky accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionBody"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /bluesky/my-posts:
    get:
      operationId: getMyPosts
      tags: [stats]
      summary: Get the authenticated user's own Bluesky posts with engagement stats
      parameters:
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Author posts with engagement stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPostsResponse"

  /bluesky/compose:
    post:
      operationId: composePost
      tags: [stats]
      summary: Publish a post or thread immediately to Bluesky
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeBody"
      responses:
        "200":
          description: Post published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeResult"

  /bluesky/scheduled:
    get:
      operationId: listScheduledPosts
      tags: [stats]
      summary: List all scheduled posts
      responses:
        "200":
          description: List of scheduled posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPost"
    post:
      operationId: createScheduledPost
      tags: [stats]
      summary: Schedule a post for future publishing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduledPostBody"
      responses:
        "201":
          description: Scheduled post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPost"

  /bluesky/scheduled/{id}:
    delete:
      operationId: deleteScheduledPost
      tags: [stats]
      summary: Delete a scheduled post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /bluesky/best-time:
    get:
      operationId: getBestTimeToPost
      tags: [stats]
      summary: Get hourly engagement heatmap for best posting times
      responses:
        "200":
          description: Hourly engagement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BestTimeResponse"

  /bluesky/hashtag-analysis:
    get:
      operationId: getHashtagAnalysis
      tags: [stats]
      summary: Analyse hashtag engagement across recent posts
      responses:
        "200":
          description: Hashtag engagement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashtagAnalysisResponse"

  /bluesky/follower-growth:
    get:
      operationId: getFollowerGrowth
      tags: [stats]
      summary: Get follower growth snapshots
      responses:
        "200":
          description: Follower growth snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowerSnapshot"

  /bluesky/snapshot-followers:
    post:
      operationId: snapshotFollowers
      tags: [stats]
      summary: Record a follower count snapshot now
      responses:
        "200":
          description: Snapshot recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowerSnapshot"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Feed:
      type: object
      properties:
        id:
          type: integer
        recordName:
          type: string
        displayName:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        publishedAt:
          type: ["string", "null"]
        postCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - recordName
        - displayName
        - isActive
        - postCount
        - createdAt
        - updatedAt

    CreateFeedBody:
      type: object
      properties:
        recordName:
          type: string
        displayName:
          type: string
        description:
          type: ["string", "null"]
      required:
        - recordName
        - displayName

    UpdateFeedBody:
      type: object
      properties:
        displayName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isActive:
          type: ["boolean", "null"]

    Keyword:
      type: object
      properties:
        id:
          type: integer
        feedId:
          type: integer
        keyword:
          type: string
        createdAt:
          type: string
      required:
        - id
        - feedId
        - keyword
        - createdAt

    CreateKeywordBody:
      type: object
      properties:
        keyword:
          type: string
      required:
        - keyword

    IndexedPost:
      type: object
      properties:
        id:
          type: integer
        uri:
          type: string
        cid:
          type: string
        author:
          type: string
        text:
          type: string
        algoTags:
          type: string
        indexedAt:
          type: string
        likes:
          type: integer
        reposts:
          type: integer
        replies:
          type: integer
        quotes:
          type: integer
        engagementSyncedAt:
          type: ["string", "null"]
      required:
        - id
        - uri
        - cid
        - author
        - text
        - algoTags
        - indexedAt
        - likes
        - reposts
        - replies
        - quotes

    PostsPage:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/IndexedPost"
        cursor:
          type: ["string", "null"]
        total:
          type: integer
      required:
        - posts
        - total

    StatsOverview:
      type: object
      properties:
        totalFeeds:
          type: integer
        activeFeeds:
          type: integer
        totalPosts:
          type: integer
        postsLast24h:
          type: integer
        postsLast1h:
          type: integer
        firehoseConnected:
          type: boolean
        uptime:
          type: number
      required:
        - totalFeeds
        - activeFeeds
        - totalPosts
        - postsLast24h
        - postsLast1h
        - firehoseConnected
        - uptime

    FirehoseStatus:
      type: object
      properties:
        connected:
          type: boolean
        endpoint:
          type: string
        reconnectCount:
          type: integer
        lastEventAt:
          type: ["string", "null"]
        postsIndexedTotal:
          type: integer
      required:
        - connected
        - endpoint
        - reconnectCount
        - postsIndexedTotal

    ActivityBucket:
      type: object
      properties:
        hour:
          type: string
        count:
          type: integer
      required:
        - hour
        - count

    PublishFeedResult:
      type: object
      properties:
        uri:
          type: string
        cid:
          type: string
        feedUri:
          type: string
      required:
        - uri
        - cid
        - feedUri

    FeedRanking:
      type: object
      properties:
        feedId:
          type: integer
        recordName:
          type: string
        displayName:
          type: string
        postCount:
          type: integer
      required:
        - feedId
        - recordName
        - displayName
        - postCount

    DailyBucket:
      type: object
      properties:
        day:
          type: string
        count:
          type: integer
      required:
        - day
        - count

    KeywordStat:
      type: object
      properties:
        keyword:
          type: string
        postCount:
          type: integer
        percentage:
          type: number
      required:
        - keyword
        - postCount
        - percentage

    AuthorStat:
      type: object
      properties:
        did:
          type: string
        postCount:
          type: integer
        latestPostAt:
          type: string
      required:
        - did
        - postCount
        - latestPostAt

    BlueskyProfile:
      type: object
      properties:
        did:
          type: string
        handle:
          type: string
        displayName:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        followersCount:
          type: integer
        followsCount:
          type: integer
        postsCount:
          type: integer
      required:
        - did
        - handle
        - followersCount
        - followsCount
        - postsCount

    BlueskyFeedInfo:
      type: object
      properties:
        uri:
          type: string
        cid:
          type: string
        displayName:
          type: string
        description:
          type: ["string", "null"]
        likeCount:
          type: integer
        viewerLiked:
          type: ["string", "null"]
      required:
        - uri
        - cid
        - displayName
        - likeCount

    AudienceUser:
      type: object
      properties:
        did:
          type: string
        handle:
          type: string
        displayName:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        followersCount:
          type: integer
        followsCount:
          type: integer
        followedAt:
          type: ["string", "null"]
      required:
        - did
        - handle
        - followersCount
        - followsCount

    AudiencePage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AudienceUser"
        cursor:
          type: ["string", "null"]
        total:
          type: integer
      required:
        - users
        - total

    SyncResult:
      type: object
      properties:
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
      required:
        - updated
        - skipped
        - errors

    BulkActionBody:
      type: object
      properties:
        dids:
          type: array
          items:
            type: string
      required:
        - dids

    BulkActionResult:
      type: object
      properties:
        succeeded:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: string
      required:
        - succeeded
        - failed
        - errors

    TopPost:
      type: object
      properties:
        id:
          type: integer
        uri:
          type: string
        cid:
          type: string
        author:
          type: string
        text:
          type: string
        algoTags:
          type: string
        indexedAt:
          type: string
        likes:
          type: integer
        reposts:
          type: integer
        replies:
          type: integer
        quotes:
          type: integer
        totalEngagement:
          type: integer
        engagementSyncedAt:
          type: ["string", "null"]
      required:
        - id
        - uri
        - cid
        - author
        - text
        - algoTags
        - indexedAt
        - likes
        - reposts
        - replies
        - quotes
        - totalEngagement

    EngagementOverview:
      type: object
      properties:
        totalPosts:
          type: integer
