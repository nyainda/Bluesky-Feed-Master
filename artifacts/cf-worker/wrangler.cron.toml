name = "feedforge-cron"
main = "src/cron.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── D1 Database (shared with feedforge-api) ───────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "feedforge-db"
database_id = "6d1329cc-e8b9-4183-bbf6-42ede9a83b74"

# ─── Cron triggers ─────────────────────────────────────────────────────────────
[triggers]
crons = ["*/3 * * * *", "0 2 * * *"]

# ─── Smart Placement ───────────────────────────────────────────────────────────
# Write-heavy / D1-heavy workload — Smart Placement correctly anchors this worker
# near D1's primary region. Cron latency is not user-facing so this is fine.
[placement]
mode = "smart"

# ─── Durable Objects — DISABLED (free-tier quota exhaustion) ──────────────────
# JetstreamConsumerDO was reverted: Cloudflare bills incoming DO WebSocket
# messages at 20:1 against the DO free-tier request quota (100K/day). At
# Bluesky's firehose volume this exhausts quota in hours. Cron approach is free.
# Re-enable binding + v1 migration on a paid plan — see jetstream-do.ts.
#
# [[durable_objects.bindings]]
# name = "JETSTREAM_DO"
# class_name = "JetstreamConsumerDO"

# Migration history — Cloudflare requires the full chain in order.
# v1: originally created JetstreamConsumerDO (already applied on Cloudflare)
# v2: deletes it — required so Cloudflare allows removing the class export
[[migrations]]
tag = "v1"
new_sqlite_classes = ["JetstreamConsumerDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["JetstreamConsumerDO"]

# ─── Secrets (set via `wrangler secret put --config wrangler.cron.toml`) ───────
# FEEDGEN_PUBLISHER_DID
# BLUESKY_HANDLE
# BLUESKY_APP_PASSWORD
# FEEDGEN_HOSTNAME
