name = "feedforge-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── D1 Database ───────────────────────────────────────────────────────────────
# After running `pnpm run db:create`, paste the database_id here
[[d1_databases]]
binding = "DB"
database_name = "feedforge-db"
database_id = "6d1329cc-e8b9-4183-bbf6-42ede9a83b74"

# ─── Cron Trigger (replaces firehose — indexes posts every 3 minutes) ──────────
[triggers]
crons = ["*/3 * * * *", "0 2 * * *"]

# ─── Smart Placement — CF auto-routes each request to the optimal PoP ──────────
# Minimises latency for readers in US, EU, APAC by running the Worker at the
# edge node closest to D1's primary region for write-heavy cron tasks and at
# the PoP closest to the requester for feed-skeleton reads.
[placement]
mode = "smart"

# ─── Non-secret env vars (set secrets via `wrangler secret put`) ────────────────
# Secrets to set via CLI:
#   wrangler secret put FEEDGEN_PUBLISHER_DID
#   wrangler secret put BLUESKY_HANDLE
#   wrangler secret put BLUESKY_APP_PASSWORD
#   wrangler secret put FEEDGEN_HOSTNAME

# ─── Local dev vars (.dev.vars file — git-ignored) ─────────────────────────────
# Copy this block into a .dev.vars file for local development:
# FEEDGEN_PUBLISHER_DID=did:plc:xxxxx
# BLUESKY_HANDLE=you.bsky.social
# BLUESKY_APP_PASSWORD=xxxx-xxxx-xxxx-xxxx
# FEEDGEN_HOSTNAME=feedforge-api.your-subdomain.workers.dev
