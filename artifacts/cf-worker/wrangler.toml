name = "feedforge-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ─── D1 Database ───────────────────────────────────────────────────────────────
# After running `pnpm run db:create`, paste the database_id here
[[d1_databases]]
binding = "DB"
database_name = "feedforge-db"
database_id = "6d1329cc-e8b9-4183-bbf6-42ede9a83b74"

# ─── No cron triggers ──────────────────────────────────────────────────────────
# All cron jobs moved to feedforge-cron worker (wrangler.cron.toml).
# This worker handles HTTP only — no scheduled() handler.
#
# Note: `[limits] cpu_ms` cannot be raised — Cloudflare rejects it on the Free
# plan ("CPU limits are not supported for the Free plan"). The 10ms/invocation
# CPU budget is fixed; see wrangler.cron.toml for how the cron worker works
# around this by rotating jobs across ticks instead.

# ─── No Smart Placement ────────────────────────────────────────────────────────
# Removed: Smart Placement picks ONE location for the whole worker based on D1
# proximity. That's correct for write-heavy cron work, but it anchors this
# read-path worker too — hurting global getFeedSkeleton latency.
# Without placement each request is handled at the nearest PoP to the reader,
# letting the existing Cache-Control headers (s-maxage=30) do their job.
# Smart Placement now lives only in wrangler.cron.toml.

# ─── Secrets (set via `wrangler secret put`) ───────────────────────────────────
#   wrangler secret put FEEDGEN_PUBLISHER_DID
#   wrangler secret put BLUESKY_HANDLE
#   wrangler secret put BLUESKY_APP_PASSWORD
#   wrangler secret put FEEDGEN_HOSTNAME
